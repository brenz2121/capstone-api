<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Profil Anak</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="page inner-page">

    <header class="inner-header">

        <a href="dashboard.html">
            ←
        </a>

        <h2>
            Profil Anak
        </h2>

    </header>


    <div class="profile-center">

        <div class="profile-large"></div>

        <strong>
            Naya
        </strong>

        <small>
            Usia 8 tahun
        </small>

    </div>


    <div class="info-box">

        <h3>
            Informasi Anak
        </h3>


        <div class="info-row">

            <span>
                Tempat Lahir
            </span>

            <span>
                Denpasar
            </span>

        </div>


        <div class="info-row">

            <span>
                Tanggal Lahir
            </span>

            <span>
                12 Januari 2018
            </span>

        </div>


        <div class="info-row">

            <span>
                Jenis Kelamin
            </span>

            <span>
                Perempuan
            </span>

        </div>


        <div class="info-row">

            <span>
                Tingkat Perkembangan
            </span>

            <span>
                Sesuai
            </span>

        </div>


        <div class="info-row">

            <span>
                Preferensi Latihan
            </span>

            <span>
                Visual & Audio
            </span>

        </div>


        <button class="outline-button">
            Ubah Profil
        </button>

    </div>


    <div class="info-box">

        <h3>
            Pengaturan anak
        </h3>


        <div class="info-row">

            <span>
                Jadwal Latihan
            </span>

            <span>
                ▣
            </span>

        </div>


        <div class="info-row">

            <span>
                Materi Toilet Training
            </span>

            <span>
                ⓘ
            </span>

        </div>

    </div>

</div>

</body>

</html>
