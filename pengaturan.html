<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pengaturan</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="page inner-page">

    <header class="inner-header">

        <a href="dashboard.html">
            ←
        </a>

        <h2>
            Pengaturan
        </h2>

    </header>


    <!-- PROFILE -->

    <div class="profile-card">

        <div class="avatar"></div>

        <div>

            <p>
                Dewi Lestari
            </p>

            <small>
                Orang Tua
            </small>

        </div>

        <span style="margin-left:auto;">
            ✎
        </span>

    </div>


    <!-- KEAMANAN -->

    <div class="setting-card">

        <div class="setting-icon">
            ●
        </div>

        <div class="setting-text">

            <strong>
                Keamanan Akun
            </strong>

            <small>
                Email, kata sandi, dll.
            </small>

        </div>

        <span class="setting-arrow">
            ›
        </span>

    </div>


    <!-- NOTIFIKASI -->

    <div class="setting-card">

        <div class="setting-icon">
            ♧
        </div>

        <div class="setting-text">

            <strong>
                Notifikasi
            </strong>

            <small>
                Atur notifikasi aplikasi
            </small>

        </div>

        <span class="setting-arrow">
            ›
        </span>

    </div>




    <div class="setting-card">

        <div class="setting-icon">
            ⓘ
        </div>

        <div class="setting-text">

            <strong>
                Bantuan
            </strong>

            <small>
                FAQ dan Panduan
            </small>

        </div>

        <span class="setting-arrow">
            ›
        </span>

    </div>


    <div class="empty-heart">

        Bersama kita dukung
        <br>
        kemandirian anak

        <span>
            ♡
        </span>

    </div>


    <button
        class="logout-button"
        onclick="window.location.href='login.html'">

        ⇥ Logout

    </button>

</div>

</body>

</html>
